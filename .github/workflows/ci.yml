name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend/src
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Verify reviewed baseline
        run: python tools/verify_baseline.py
      - name: Regenerate contracts and client types
        run: |
          python tools/export_contracts.py
          python tools/generate_ts.py
      - name: Check generated-file drift
        run: git diff --exit-code -- contracts frontend/src/api/generated.ts
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
