name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONPATH: backend/src
      PYTHONUTF8: "1"
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Verify reviewed baseline
        run: python tools/verify_baseline.py
      - name: Regenerate contracts and client types
        run: |
          python tools/export_contracts.py
          python tools/generate_ts.py
      - name: Check generated-file drift
        run: git diff --exit-code -- contracts frontend/src/api/generated.ts
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Verify native toolchain
        run: python tools/preflight.py
      - name: Verify installed dependency closure
        run: python tools/bootstrap.py --check
      - name: Reproduce persisted no-paid replay
        run: python tools/reproduce_core_flow.py --mode replay --output-dir .runtime/reproduction-ci
      - name: Exercise MCP stdio boundary
        run: python tools/mcp_smoke.py --db .runtime/mcp-smoke-ci.sqlite
      - name: Verify supervised native startup
        run: python tools/start_all.py --verify-only --runtime-dir .runtime/native-stack-ci
      - name: Exercise isolated HTTP flow
        run: python tools/smoke_local.py
